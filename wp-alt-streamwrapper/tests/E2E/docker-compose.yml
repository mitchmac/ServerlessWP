services:
  wordpress:
    image: wordpress:php8.3
    depends_on:
      db:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      # Stream wrapper configuration
      WP_STREAM_PROVIDER: s3
      WP_STREAM_S3_BUCKET: wp-uploads
      WP_STREAM_S3_REGION: us-east-1
      WP_STREAM_S3_ENDPOINT: http://minio:9000
      WP_STREAM_S3_KEY: minioadmin
      WP_STREAM_S3_SECRET: minioadmin
    volumes:
      - ../..:/var/www/html/wp-content/mu-plugins/wp-alt-streamwrapper:ro
      - ../../bootstrap/mu-loader.php:/var/www/html/wp-content/mu-plugins/wp-alt-streamwrapper.php:ro
      - ./setup/php-prepend.ini:/usr/local/etc/php/conf.d/wp-alt-streamwrapper.ini:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-login.php"]
      interval: 5s
      timeout: 5s
      retries: 20

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwp", "-pwp"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  blob:
    image: node:20-alpine
    command: node /emulator/server.js
    environment:
      PORT: "7000"
      STORE_ID: teststore
      ACCESS: public
      # No CDN-staleness simulation: the adapter always reads with cache=0,
      # so cached reads are never exercised here.
      BLOB_CACHE_STALE_MS: "0"
    volumes:
      - ./blob-emulator:/emulator:ro

  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb local/wp-uploads --ignore-existing &&
        mc anonymous set public local/wp-uploads
      "
