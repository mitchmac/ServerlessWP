name: e2e Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  routing:
    name: vercel routing
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - run: npm ci

      - run: ./test/run-vercel-routing-test.sh

  jest:
    name: e2e tests
    runs-on: ubuntu-latest
    if: github.repository_owner == 'mitchmac'
    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - run: ./run-db-test.sh
        working-directory: ./test

      - run: ./run-s3-test.sh
        working-directory: ./test

      - run: ./run-blob-test.sh
        working-directory: ./test

      # What the deploy button sets up: a connected store authenticating with
      # OIDC through BLOB_STORE_ID, with no read-write token in the project.
      - name: blob tests with OIDC credentials
        run: BLOB_AUTH=oidc ./run-blob-test.sh
        working-directory: ./test

      # A warm container gets its ETag from its own upload and then only ever
      # revalidates, so it never writes using a download's ETag. Cold instances
      # do that on every first request, which is where conditional writes broke
      # in production. BLOB_NO_CONDITIONAL_READS makes every read a full one.
      - name: blob tests with cold-instance reads
        run: BLOB_NO_CONDITIONAL_READS=1 ./run-blob-test.sh
        working-directory: ./test
