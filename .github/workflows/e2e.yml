name: e2e Tests
on: [push, pull_request]
jobs:
  jest:
    name: e2e tests
    runs-on: ubuntu-latest
    if: github.repository_owner == 'mitchmac'
    steps:

      - name: Checkout
        uses: actions/checkout@v3

      # Runs before the Docker suites for fast feedback. Needs the root
      # dependencies, not the ones in test/.
      - name: Install root dependencies
        run: npm install

      - name: sqlite unit tests
        # Serial: the test files share the plugin's hardcoded /tmp cache and
        # etag paths, and node --test runs files in parallel processes.
        run: node --test --test-concurrency=1 storage.test.js sqliteS3.concurrency.test.js sqliteVercelBlob.etag.test.js sqliteVercelBlob.auth.test.js sqliteVercelBlob.concurrency.test.js
        working-directory: ./test

      # The WordPress update rules. These decide which files an update
      # overwrites and deletes in a fork, so they run before anything slow.
      - name: WordPress updater unit tests
        run: node --test wpUpdate.plan.test.js wpUpdate.apply.test.js wpUpdate.plugins.test.js wpUpdate.themes.test.js wpUpdate.github.test.js
        working-directory: ./test

      - run: ./run-db-test.sh
        working-directory: ./test

      - run: ./run-s3-test.sh
        working-directory: ./test

      - run: ./run-blob-test.sh
        working-directory: ./test

      # What the deploy button sets up: a connected store authenticating with
      # OIDC through BLOB_STORE_ID, with no read-write token in the project.
      - name: blob tests with OIDC credentials
        run: BLOB_AUTH=oidc ./run-blob-test.sh
        working-directory: ./test

      # A warm container gets its ETag from its own upload and then only ever
      # revalidates, so it never writes using a download's ETag. Cold instances
      # do that on every first request, which is where conditional writes broke
      # in production. BLOB_NO_CONDITIONAL_READS makes every read a full one.
      - name: blob tests with cold-instance reads
        run: BLOB_NO_CONDITIONAL_READS=1 ./run-blob-test.sh
        working-directory: ./test
